<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>You're offline · Maxxed Out University</title>
  <meta name="theme-color" content="#0000FF" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-180.png" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    .badge {
      width: 96px; height: 96px;
      border-radius: 24px;
      background: linear-gradient(135deg, #0000FF, #0000CC);
      display: flex; align-items: center; justify-content: center;
      margin: 0 0 28px;
      box-shadow: 0 12px 30px rgba(0, 0, 255, 0.25);
    }
    .badge svg { width: 44px; height: 44px; color: #fff; }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin: 0 0 12px;
      max-width: 18ch;
    }
    p {
      font-size: 16px;
      line-height: 1.55;
      color: #475569;
      max-width: 42ch;
      margin: 0 0 28px;
    }
    button {
      appearance: none;
      border: none;
      cursor: pointer;
      background: #0000FF;
      color: #fff;
      font: inherit;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 22px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 255, 0.25);
      transition: transform 120ms ease, background-color 120ms ease;
    }
    button:hover { background: #0000CC; }
    button:active { transform: translateY(1px); }
    .hint {
      margin-top: 18px;
      font-size: 12px;
      color: #94a3b8;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Maxxed Out University needs an internet connection to load this page. Check your connection and try again.</p>
    <button type="button" onclick="window.location.reload()">Retry</button>
    <p class="hint">Already-cached lessons may still load — try the back button.</p>
  </main>
</body>
</html>
